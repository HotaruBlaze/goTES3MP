syntax = "proto3";

package main;
option go_package = "github.com/hotarublaze/gotes3mp";

message RawDiscordStruct {
    string channel = 1;
    string server = 2;
    string message = 3;
}

message ServerSync {
    string job_id = 1;
    string server_id = 2;
    string status = 3;
    string method = 4;
}

// Messages related to responses and commands
message BaseResponse {
    string job_id = 1;
    string server_id = 2;
    string method = 3;
    string source = 4;
    string target = 5;
    map<string, string> data = 6;
}

message CommandArg {
    bool required = 1;
    string name = 2;
    string description = 3;
}

message CommandData {
    string command = 1;
    string description = 2;
    repeated CommandArg args = 3;
}

message CommandResponse {
    string job_id = 1;
    string server_id = 2;
    string method = 3;
    string source = 4;
    CommandData data = 5;
}

message DiscordSlashCommand {
    string server_id = 1;
    string method = 2;
    string source = 3;
    string job_id = 4;
    CommandData data = 5;
}

message Metadata {
    string method = 1;
    string source = 2;
    string server_id = 3;
    string job_id = 4;
    map<string, string> additional_data = 5;
}

// Represents a Discord embed field.
message EmbedField {
  string name = 1;
  string value = 2;
  bool inline = 3;
}

// Represents a full Discord embed payload.
message EmbedPayload {
  string channel_id = 1;   // Target Discord channel ID
  string content = 2;      // Optional message text before embed
  string title = 3;        // Embed title
  uint32 color = 4;        // Color (0xRRGGBB)
  repeated EmbedField fields = 5; // Embed fields
  string footer_text = 6;  // Footer text
  string footer_icon = 7;  // Footer icon URL
  bool timestamp = 8;      // Whether to include a timestamp
}
